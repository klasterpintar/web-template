# Nginx Configuration for Web Template
# This is an example configuration for reverse proxy setup in production

# Upstream configuration for backend API
upstream backend_api {
    # PM2 cluster mode with 2 instances
    server localhost:5000;
    keepalive 64;
}

# Upstream configuration for frontend
upstream frontend_app {
    server localhost:3000;
    keepalive 64;
}

